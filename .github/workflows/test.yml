name: test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-latest
    name: install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: latest
        uses: ./
        with:
          version: latest
      - run: ecspresso version 2>&1 | grep -F v2.

      - name: specific version
        uses: ./
        with:
          version: v2.0.4
      - run: ecspresso version 2>&1 | grep -F v2.0.4

      - name: v1 version
        uses: ./
        with:
          version: v1.7.14
      - run: ecspresso version 2>&1 | grep -F v1.7.14

      - name: version-file
        uses: ./
        with:
          version-file: tests/.ecspresso-version
      - run: ecspresso version 2>&1 | grep -F v2.0.0

      - name: version-file with v prefix
        uses: ./
        with:
          version-file: tests/.ecspresso-version-v
      - run: ecspresso version 2>&1 | grep -F v2.0.4

      - name: args
        uses: ./
        with:
          version: v2.0.4
          args: version

      - name: invalid version
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          version: "v2.0.4/../../evil"
      - name: invalid version must fail
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: test "${OUTCOME}" = "failure"

      - name: missing release
        id: missing
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0
      - name: missing release must fail
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: test "${OUTCOME}" = "failure"
